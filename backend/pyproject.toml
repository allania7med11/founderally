[project]
name = "founderally-backend"
version = "0.1.0"
description = "API and workers for FounderAlly"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "fastapi>=0.142",
    "httpx>=0.28",
    "langgraph==1.2.15",
    "openai>=2.20",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.15",
    "python-json-logger>=4.2.0",
    "sqlalchemy[asyncio]>=2.1",
    "tavily-python>=0.7",
    "temporalio[langgraph]==1.34.0",
    "tenacity>=9.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, async mistakes, breakpoint() and pdb left in
select = ["E", "F", "W", "I", "ASYNC", "T10"]

[tool.ruff.lint.isort]
known-first-party = ["activities", "api", "contracts", "db", "settings", "tests", "worker", "workflows"]

[tool.ruff.lint.per-file-ignores]
# the stack tests poll Postgres for rows another process writes, where no asyncio.Event can reach
"tests/stack/**" = ["ASYNC110"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["stack: needs the running stack: make up, make migrate"]
